<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – IA22 | Zone non trouvée</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .glitch {
            font-size: 6rem;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            animation: glitch 1s infinite;
        }
        @keyframes glitch {
            0% { text-shadow: 2px 0 #f00, -2px 0 #0ff; }
            25% { text-shadow: -2px 0 #f00, 2px 0 #0ff; }
            50% { text-shadow: 2px 0 #0ff, -2px 0 #f00; }
            75% { text-shadow: -2px 0 #0ff, 2px 0 #f00; }
            100% { text-shadow: 2px 0 #f00, -2px 0 #0ff; }
        }
        h1 { font-size: 1.8rem; margin: 20px 0 10px; letter-spacing: 3px; }
        p { opacity: 0.8; margin-bottom: 30px; max-width: 500px; line-height: 1.5; }
        a {
            color: #0f0;
            text-decoration: none;
            border: 1px solid #0f0;
            padding: 12px 30px;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: bold;
        }
        a:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="glitch">404</div>
    <h1>ZONE NON TROUVÉE</h1>
    <p>
        Le protocole IA22 n’a pas pu localiser cette ressource.<br>
        Accès refusé ou chemin inexistant.
    </p>
    <a href="/">← RETOUR AU NOYAU</a>

    <div class="footer">
        NetSecurePro-IA22 • Système Souverain
    </div>
</body>
</html>
